<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOUN Search - Part 1</title>

    <script src="https://unpkg.com/jspsych@7.3.4/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-preload@1.1.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3/dist/index.browser.js"></script>
    <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>

    <style>
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .screen-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
        }

        .fixation {
            font-size: 60px;
            font-weight: 300;
            color: #000000;
            user-select: none;
        }

        .instr {
            max-width: 800px;
            text-align: center;
            font-size: 22px;
            line-height: 1.6;
            color: #333333;
            padding: 20px;
        }
        .instr h1, .instr h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #000000;
        }
        .small-note {
            margin-top: 30px;
            font-size: 18px;
            color: #666666;
        }

        .arena-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
        }
        .arena {
            position: relative;
            background-color: #ffffff;
        }
        .arena-fix {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            color: #cccccc;
            user-select: none;
        }

        .stim-container {
            position: absolute;
        }

        .stim-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .stim-obj {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            object-fit: contain;
            pointer-events: none;
        }

        .cue-img {
            object-fit: contain;
        }

        .cue-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .cue-label {
            font-size: 24px;
            color: #333333;
        }

        .feedback-good { color: #2e7d32; font-size: 42px; font-weight: bold; }
        .feedback-bad { color: #c62828; font-size: 42px; font-weight: bold; }
        .feedback-slow { color: #f57c00; font-size: 42px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>
    <script src="noun-search-prototype.js"></script>
</body>
</html>
